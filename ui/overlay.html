<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
  <title>Pixel Octo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    #octo { display: block; width: 100%; height: 100%; cursor: grab; }
    #octo:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="octo" aria-label="Pixel Octo"></canvas>
  <div id="layer" class="layer"></div>
  <script type="module" src="./overlay.js"></script>
</body>
</html>

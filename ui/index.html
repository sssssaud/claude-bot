<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Octo 3D test</title>
  <style>
    :root { --bg: #17121a; --ink: #f4eae5; --mut: #b7a6a4; --terra: #E07A5F; --chip: #2a222d; --line: #3a2f3d; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; background: var(--bg); color: var(--ink);
           font: 14px/1.4 system-ui, sans-serif; }
    /* checkerboard behind the canvas proves the octo renders on a transparent background */
    #stage { min-height: 0; background: repeating-conic-gradient(#2a222d 0 25%, #211a24 0 50%) 0 0 / 24px 24px; }
    #octo { display: block; width: 100%; height: 100%; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; }
    button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
             padding: 6px 14px; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--terra); outline: none; }
    label { display: flex; gap: 6px; align-items: center; color: var(--mut); }
    #stats { margin-left: auto; color: var(--mut); font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <main id="stage"><canvas id="octo" aria-label="3D Pixel Octo"></canvas></main>
  <nav aria-label="Moves">
    <button data-move="idle">idle</button>
    <button data-move="blink">blink</button>
    <button data-move="turnAround">turnAround</button>
    <button data-move="jump">jump</button>
    <button data-move="roll">roll</button>
    <label><input id="outline" type="checkbox" checked> outline</label>
    <span id="stats"></span>
  </nav>
  <script type="module" src="./main.js"></script>
</body>
</html>
